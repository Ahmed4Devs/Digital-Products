# Local development services only. Production uses an independent PostgreSQL 18,
# Cloudflare R2 and Resend (see docs/DEPLOYMENT.md once Phase 10 lands).
#
# Run through the package scripts so variables come from .env.local:
#   pnpm services:up   /   pnpm services:down
#
# Every port is bound to 127.0.0.1 and uses a project-specific number so it
# never collides with other local projects.

name: digital-products

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env.local}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env.local}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.local}
      APP_DB_NAME: ${APP_DB_NAME:?set APP_DB_NAME in .env.local}
    ports:
      - "127.0.0.1:5462:5432"
    volumes:
      # The PostgreSQL 18 image keeps PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:1032:1025"
      - "127.0.0.1:8032:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO stopped publishing community images in late 2025; this builds on
    # Chainguard's free image, which is compiled from current MinIO source.
    build:
      context: ./docker/minio
      dockerfile: server.Dockerfile
    image: digital-products/minio:local
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.local}
      # Browser uploads use pre-signed PUT URLs from the app origin only.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:?set APP_URL in .env.local}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio-data:/data

  minio-init:
    build:
      context: ./docker/minio
      dockerfile: init.Dockerfile
    image: digital-products/minio-init:local
    restart: "no"
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env.local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env.local}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?set S3_BUCKET_PRIVATE in .env.local}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?set S3_BUCKET_PUBLIC in .env.local}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro

volumes:
  postgres-data:
  minio-data:
